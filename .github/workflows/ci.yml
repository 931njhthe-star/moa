# CI / CD — 커밋 → 정적 검사 · 테스트 → 이미지 빌드 → (main 만) EC2 순차 배포
#
#   lint · test-backend · test-frontend   main · dev push 와 그쪽으로 향하는 PR 마다. 실패하면 뒤 단계로 가지 않는다(배포 차단)
#   build                                 세 검사가 모두 통과하면 backend · frontend 이미지를 빌드해 본다
#   deploy                                main push 만. ECR push → EC2 에 compose · 설정 · 스크립트 복사 →
#                                         scripts/deploy.sh 로 순차 교체(공용 → 해석 서비스 → 앱 A → A UP 확인 → 앱 B) → 8501 확인
#   report-failure                        push 에서 실패하면 GitHub Issue 를 만들어 커밋 작성자에게 할당
#
# 배포 구성은 PRD 5.4 — 공용 스택(docker-compose.core.yml) + 앱 스택 A/B(docker-compose.app.yml)
name: CI / CD

on:
  push:
    branches: [main, dev]   # main, dev 브랜치에 push될 때 실행
  pull_request:
    branches: [main, dev]   # main, dev 브랜치로 향하는 PR일 때 실행

jobs:
  # 정적 검사 (PRD 6.4.1 · v1.9) — 실행 전에 확실히 깨지는 것만 잡는다:
  #   E9 구문 오류 · F63 잘못된 비교 · F7 잘못된 문장 위치 · F82 정의되지 않은 이름.
  #   스타일 규칙은 넣지 않는다 — 기존 코드를 고치지 않고 붙이기 위해서다
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: ruff 설치
        run: pip install ruff==0.8.4

      - name: 정적 검사
        run: ruff check --select E9,F63,F7,F82 --output-format github backend frontend

  test-backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend   # 백엔드 폴더 기준으로 명령 실행
    # 실습 DB 대신 일회용 PostgreSQL 로 전체 흐름(tests/test_live_flow.py)까지 돌린다.
    # 계약 테스트만으로는 서비스 계층(세션 · 질문 · 공유)이 실행되지 않아 "조용히 틀림"을 못 잡는다
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      APP_RW_PASSWORD: ci-app-rw
      HEALING_RW_PASSWORD: ci-healing-rw
      MOA_LIVE_DB: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements-dev.txt

      - name: 스키마 · 메뉴 시드 적재
        run: python sql/run_sql.py

      - name: 테스트 실행
        # 커버리지 80% 미만이면 테스트가 모두 통과해도 실패 → 테스트를 지우는 변경을 막는다
        # (PRD SC-10 80% 에 맞춤 — v1.9. 실측 84.9% · 2026-11-04 CI 41855235629. 종전 기준 75%)
        run: pytest -q --cov=app --cov-fail-under=80

  test-frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend  # 프론트엔드 폴더 기준으로 명령 실행
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements-dev.txt

      - name: 테스트 실행
        # 화면(app.py)은 제외하고 백엔드 호출부(api_client)만 커버리지를 잰다
        run: pytest -q --cov=api_client --cov-fail-under=85

  build:
    needs: [lint, test-backend, test-frontend]   # 정적 검사 · 두 테스트가 모두 성공해야 빌드된다
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 백엔드 Docker 이미지 빌드 (빌드 가능 여부만 검증)
        run: docker build -t moa-backend:${{ github.sha }} backend

      - name: 프론트엔드 Docker 이미지 빌드 (빌드 가능 여부만 검증)
        run: docker build -t moa-frontend:${{ github.sha }} frontend

  # 배포 — main 에 push 될 때만 (dev push · PR 은 여기서 멈춘다)
  # 테스트 · 빌드가 모두 통과해야 실행된다 → 깨진 코드는 EC2 에 나가지 않는다 (PRD G-5 · SC-7)
  # 필요한 Secrets: AWS_ACCESS_KEY_ID · AWS_SECRET_ACCESS_KEY (ECR push 권한)
  #                 ECR_REGISTRY (<계정 ID>.dkr.ecr.ap-northeast-2.amazonaws.com)
  #                 EC2_HOST · EC2_SSH_KEY (PEM 전체)
  #                 EC2_SG_ID (EC2 보안 그룹 ID, sg-...) — 러너 IP 를 배포하는 동안만 22번에 허용한다
  #                 IAM 사용자에 ec2:AuthorizeSecurityGroupIngress · ec2:RevokeSecurityGroupIngress 권한 필요
  # SSH 사용자는 기본 ubuntu — 다르면 저장소 Variables 에 EC2_USER 를 둔다 (Amazon Linux 는 ec2-user)
  deploy:
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-production   # 배포는 한 번에 하나씩, 진행 중인 배포는 취소하지 않는다
      cancel-in-progress: false
    env:
      AWS_REGION: ap-northeast-2
      TAG: ${{ github.sha }}
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
      SSH_TARGET: ${{ vars.EC2_USER || 'ubuntu' }}@${{ secrets.EC2_HOST }}
    steps:
      - uses: actions/checkout@v5

      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 빌드 · ECR push (커밋 sha 태그 + latest)
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}/
        run: |
          for svc in backend frontend; do
            img="${REGISTRY}moa-${svc}"
            docker build -t "$img:$TAG" -t "$img:latest" "$svc"
            docker push "$img:$TAG"
            docker push "$img:latest"
          done

      # 러너는 매번 다른 IP 에서 접속한다 → 보안 그룹에 이 러너 IP/32 만 잠깐 열고 마지막 단계에서 반드시 닫는다
      - name: 러너 IP 를 보안 그룹 22번에 허용
        id: runner_ip
        run: |
          ip=$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress --group-id "${{ secrets.EC2_SG_ID }}"             --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$ip/32,Description=github-actions-deploy}]"
          echo "허용: $ip/32"

      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          # 규칙이 반영되기까지 몇 초 걸릴 수 있어 재시도한다
          for i in $(seq 1 6); do
            if ssh-keyscan -T 10 -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null                && [ -s ~/.ssh/known_hosts ]; then
              exit 0
            fi
            echo "22번 접속 대기 중 ($i/6)"; sleep 5
          done
          echo "::error::EC2_HOST 22번에 접속하지 못했다 — EC2_HOST(퍼블릭 IP) · 인스턴스 실행 상태 · EC2_SG_ID 가 맞는지 확인"
          exit 1

      - name: EC2 배포 파일 복사 (공용 + 앱 compose · 게이트웨이 · 소켓 프록시 설정 · 스크립트)
        run: |
          # 소스 코드는 보내지 않는다 — 서버는 빌드하지 않고 ECR 이미지를 받는다 (README 방법 3)
          tar czf - docker-compose.core.yml docker-compose.app.yml gateway socket-proxy scripts | ssh -i ~/.ssh/ec2.pem "$SSH_TARGET" "mkdir -p ~/moa && tar xzf - -C ~/moa"

      - name: EC2 순차 배포 (공용 → 해석 서비스 → 앱 A → A UP 확인 → 앱 B)
        run: |
          # 두 앱 스택을 동시에 내리지 않는다. A 가 게이트웨이에서 UP 이 안 되면 B 는 그대로 두고 실패한다 (PRD 5.4)
          ssh -i ~/.ssh/ec2.pem "$SSH_TARGET" bash -s <<SCRIPT
          set -euo pipefail
          cd ~/moa
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
          TAG=$TAG bash scripts/deploy.sh
          SCRIPT

      - name: 배포 확인 (게이트웨이 8501 응답)
        run: |
          for i in $(seq 1 30); do
            if ssh -i ~/.ssh/ec2.pem "$SSH_TARGET" "curl -fsS http://localhost:8501/_stcore/health" >/dev/null 2>&1; then
              echo "배포 성공: $TAG"; exit 0
            fi
            sleep 5
          done
          echo "게이트웨이가 150초 안에 응답하지 않았다"
          exit 1

      - name: 배포 실패 시 상태 · 로그
        if: failure() && steps.runner_ip.outputs.ip != ''
        run: |
          ssh -i ~/.ssh/ec2.pem "$SSH_TARGET" bash -s <<'SCRIPT' || true
          cd ~/moa
          docker ps -a --format 'table {{.Names}} {{.Image}} {{.Status}}' | grep '^moa-' | sort
          docker exec moa-core-gateway-1 wget -qO- 'http://127.0.0.1:8404/stats;csv' | grep '^app,' | cut -d, -f1,2,18
          for c in moa-core-gateway-1 moa-a-backend-1 moa-b-backend-1; do echo "--- $c"; docker logs --tail 30 "$c" 2>&1; done
          SCRIPT

      - name: 러너 IP 허용 회수
        if: always() && steps.runner_ip.outputs.ip != ''
        run: |
          aws ec2 revoke-security-group-ingress --group-id "${{ secrets.EC2_SG_ID }}"             --protocol tcp --port 22 --cidr "${{ steps.runner_ip.outputs.ip }}/32"

  # CI 실패 → GitHub Issue 자동 생성 · 커밋 작성자에게 할당 (PRD 6.4.3 · SC-11 · v1.9)
  #   main · dev 로의 push 에서만 만든다 — PR 마다 만들면 작업 중 실패로 이슈가 쌓인다
  report-failure:
    needs: [lint, test-backend, test-frontend, build]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: 실패 이슈 생성 · 할당
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="[CI 실패] ${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
          body="CI 파이프라인이 실패했습니다. 실행 기록에서 실패 단계와 로그를 확인하세요.
          - 브랜치: ${GITHUB_REF_NAME}
          - 커밋: ${GITHUB_SHA}
          - 작성자: ${GITHUB_ACTOR}
          - 실행 기록: ${RUN_URL}"
          # 할당이 실패해도(협업자가 아닌 계정 등) 이슈는 남긴다
          gh issue create --title "$title" --body "$body" --assignee "$GITHUB_ACTOR" \
            || gh issue create --title "$title" --body "$body"
