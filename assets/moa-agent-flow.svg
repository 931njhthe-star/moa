<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1050" viewBox="0 0 1280 1050" role="img" aria-labelledby="title desc">
<title id="title">MOA 멀티 에이전트 처리 흐름</title><desc id="desc">단톡방 입력에서 Orchestrator, Intake Agent, Menu Agent, 규칙 검증, 정산 및 Review Agent를 거쳐 최종 주문서를 만드는 순서도</desc>
<rect width="1280" height="1050" fill="#f9fbf8"/>
<text x="70" y="67" font-family="Arial,'Noto Sans KR',sans-serif" fill="#122d1c" font-size="38" font-weight="700">MOA · 멀티 에이전트 처리 흐름</text>
<text x="70" y="102" font-family="Arial,'Noto Sans KR',sans-serif" fill="#5a6e60" font-size="21">단톡방 대화에서 정확한 최종 주문서까지</text>
<rect x="74" y="130" width="490" height="95" rx="20" fill="#ffffff" stroke="#c9dccb" stroke-width="2"/>
<circle cx="117" cy="177" r="24" fill="#e2f1e3"/>
<text x="117" y="185" fill="#1f7439" font-size="23" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">✉</text>
<text x="160" y="187" fill="#163820" font-size="27" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="700">단톡방 대화 입력</text>
<rect x="605" y="136" width="605" height="83" rx="16" fill="#f0f3f1"/>
<text x="632" y="185" fill="#2b4132" font-size="20" font-family="Arial,'Noto Sans KR',sans-serif">단체 채팅의 주문·취소·변경 메시지를 붙여 넣습니다.</text>
<path d="M319 228 V241" stroke="#247a43" stroke-width="5" stroke-linecap="round"/><path d="M310 233 L319 244 L328 233" fill="none" stroke="#247a43" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="74" y="260" width="490" height="95" rx="20" fill="#e4f2e5" stroke="#c9dccb" stroke-width="2"/>
<circle cx="117" cy="307" r="24" fill="#e2f1e3"/>
<text x="117" y="315" fill="#1f7439" font-size="23" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">↳</text>
<text x="160" y="317" fill="#163820" font-size="27" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="700">Orchestrator</text>
<rect x="605" y="266" width="605" height="83" rx="16" fill="#f0f3f1"/>
<text x="632" y="315" fill="#2b4132" font-size="20" font-family="Arial,'Noto Sans KR',sans-serif">LangGraph · 규칙 기반 실행 순서로 처리 단계를 조정합니다.</text>
<path d="M319 358 V371" stroke="#247a43" stroke-width="5" stroke-linecap="round"/><path d="M310 363 L319 374 L328 363" fill="none" stroke="#247a43" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="74" y="390" width="490" height="95" rx="20" fill="#ffffff" stroke="#c9dccb" stroke-width="2"/>
<circle cx="117" cy="437" r="24" fill="#e2f1e3"/>
<text x="117" y="445" fill="#1f7439" font-size="23" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">1</text>
<text x="160" y="447" fill="#163820" font-size="27" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="700">Intake Agent</text>
<rect x="605" y="396" width="605" height="83" rx="16" fill="#f0f3f1"/>
<text x="632" y="445" fill="#2b4132" font-size="20" font-family="Arial,'Noto Sans KR',sans-serif">주문 추가 · 취소 · 변경 의도와 핵심 정보를 추출합니다.</text>
<path d="M319 488 V501" stroke="#247a43" stroke-width="5" stroke-linecap="round"/><path d="M310 493 L319 504 L328 493" fill="none" stroke="#247a43" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="74" y="520" width="490" height="95" rx="20" fill="#ffffff" stroke="#c9dccb" stroke-width="2"/>
<circle cx="117" cy="567" r="24" fill="#e2f1e3"/>
<text x="117" y="575" fill="#1f7439" font-size="23" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">2</text>
<text x="160" y="577" fill="#163820" font-size="27" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="700">Menu Agent</text>
<rect x="605" y="526" width="605" height="83" rx="16" fill="#f0f3f1"/>
<text x="632" y="575" fill="#2b4132" font-size="20" font-family="Arial,'Noto Sans KR',sans-serif">메뉴 약칭과 옵션을 매칭합니다. 규칙 우선, 필요 시 LLM·도구 활용.</text>
<path d="M319 618 V631" stroke="#247a43" stroke-width="5" stroke-linecap="round"/><path d="M310 623 L319 634 L328 623" fill="none" stroke="#247a43" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="74" y="650" width="490" height="95" rx="20" fill="#ffffff" stroke="#c9dccb" stroke-width="2"/>
<circle cx="117" cy="697" r="24" fill="#e2f1e3"/>
<text x="117" y="705" fill="#1f7439" font-size="23" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">3</text>
<text x="160" y="707" fill="#163820" font-size="27" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="700">규칙 검증</text>
<rect x="605" y="656" width="605" height="83" rx="16" fill="#f0f3f1"/>
<text x="632" y="705" fill="#2b4132" font-size="20" font-family="Arial,'Noto Sans KR',sans-serif">변경·취소 대상을 연결하고 수량·옵션을 검증합니다.</text>
<path d="M319 748 V761" stroke="#247a43" stroke-width="5" stroke-linecap="round"/><path d="M310 753 L319 764 L328 753" fill="none" stroke="#247a43" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="74" y="780" width="490" height="95" rx="20" fill="#ffffff" stroke="#c9dccb" stroke-width="2"/>
<circle cx="117" cy="827" r="24" fill="#e2f1e3"/>
<text x="117" y="835" fill="#1f7439" font-size="23" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">4</text>
<text x="160" y="837" fill="#163820" font-size="27" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="700">정산 + Review Agent</text>
<rect x="605" y="786" width="605" height="83" rx="16" fill="#f0f3f1"/>
<text x="632" y="835" fill="#2b4132" font-size="20" font-family="Arial,'Noto Sans KR',sans-serif">주문을 반영하고 가격을 계산하며, 모호한 항목을 확인합니다.</text>
<path d="M319 878 V891" stroke="#247a43" stroke-width="5" stroke-linecap="round"/><path d="M310 883 L319 894 L328 883" fill="none" stroke="#247a43" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="74" y="910" width="490" height="95" rx="20" fill="#145c39" stroke="#145c39" stroke-width="2"/>
<circle cx="117" cy="957" r="24" fill="#b3e8ba"/>
<text x="117" y="965" fill="#1f7439" font-size="23" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">✓</text>
<text x="160" y="967" fill="#ffffff" font-size="27" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="700">최종 주문서</text>
<rect x="605" y="916" width="605" height="83" rx="16" fill="#e6f3e8"/>
<text x="632" y="965" fill="#2b4132" font-size="20" font-family="Arial,'Noto Sans KR',sans-serif">추가·취소·변경이 반영된 주문서를 생성합니다.</text>

</svg>