# 로컬 개발용 덧씌우기 (공용 스택) — 배포에서 쓰지 않는다
#
#   docker compose -f docker-compose.core.yml -f docker-compose.core.dev.yml -p moa-core up -d
#
# 호스트에서 run_sql.py · uvicorn 이 DB 에 붙도록 127.0.0.1:5433 에만 연다 (PC 의 PostgreSQL 5432 와 안 부딪히게)
services:
  db:
    ports:
      - "127.0.0.1:5433:5432"

  # 게이트웨이 상태 페이지를 브라우저로 본다: http://localhost:8404/stats
  gateway:
    ports:
      - "127.0.0.1:8404:8404"
