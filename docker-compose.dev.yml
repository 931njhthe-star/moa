# 로컬 개발용 덧씌우기 — 배포 파일(docker-compose.yml)은 frontend 8501 만 연다 (D-03 v1.3 7.2)
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# 백엔드 API 를 브라우저 · curl 로 직접 보려면 8000 을 연다. 배포에서 이 파일을 쓰지 않는다.
services:
  backend:
    ports:
      - "8000:8000"

  # 호스트에서 run_sql.py · uvicorn 이 DB 에 붙도록 연다. 127.0.0.1 에만 — 같은 네트워크의 다른 PC 에는 열지 않는다
  #   DB 만 띄우기:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d db
  #   backend/.env:  DATABASE_URL=postgresql://postgres:<POSTGRES_PASSWORD>@localhost:5433/postgres
  # 5433 인 이유: PC 에 설치된 PostgreSQL(5432)과 부딪히지 않게
  db:
    ports:
      - "127.0.0.1:5433:5432"
