<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Moa 배너: 단톡방 주문 대화가 주문서 한 장으로 정리되고, 장애 대응 층이 정상 상태를 지킨다">
  <defs>
    <style>
      text { font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
      .ink { fill: #18181B; }
      .ink3 { fill: #38383C; }
      .muted { fill: #6A6A70; }
      .green { fill: #2E7154; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#18181B" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="1280" height="400" rx="20" fill="#FAFAF9"/>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="20" fill="none" stroke="#EAEAE7"/>
  <circle cx="1210" cy="40" r="150" fill="#EAF3EE"/>
  <circle cx="60" cy="380" r="90" fill="#F2F2F0"/>

  <!-- 왼쪽: 제목 -->
  <g transform="translate(64,0)">
    <rect x="0" y="92" width="196" height="30" rx="15" fill="#EEF5F1" stroke="#D3E6DA"/>
    <text x="98" y="112" text-anchor="middle" font-size="14" font-weight="700" class="green">OrderOps AI Auto Healing</text>
    <text x="0" y="200" font-size="84" font-weight="800" class="ink" letter-spacing="-2">Moa</text>
    <text x="0" y="246" font-size="24" font-weight="700" class="ink3">단톡방 주문 대화를, 주문서 한 장으로.</text>
    <text x="0" y="280" font-size="17" class="muted">장애가 나도 멈추지 않게 — 감지 · 진단 · 복구 · 검증</text>
    <g font-size="13" font-weight="600" class="ink3">
      <rect x="0" y="306" width="96" height="28" rx="8" fill="#FFFFFF" stroke="#E4E4E1"/>
      <text x="48" y="325" text-anchor="middle">멀티 에이전트</text>
      <rect x="106" y="306" width="96" height="28" rx="8" fill="#FFFFFF" stroke="#E4E4E1"/>
      <text x="154" y="325" text-anchor="middle">LangGraph</text>
      <rect x="212" y="306" width="96" height="28" rx="8" fill="#FFFFFF" stroke="#E4E4E1"/>
      <text x="260" y="325" text-anchor="middle">무중단 배포</text>
    </g>
  </g>

  <!-- 가운데: 단톡방 대화 -->
  <g transform="translate(486,64)" filter="url(#shadow)">
    <rect width="300" height="272" rx="16" fill="#FFFFFF" stroke="#EAEAE7"/>
  </g>
  <g transform="translate(486,64)">
    <text x="20" y="34" font-size="14" font-weight="700" class="ink3">단톡방 대화</text>
    <text x="280" y="34" text-anchor="end" font-size="12" class="muted">붙여넣기</text>
    <line x1="20" y1="48" x2="280" y2="48" stroke="#EFEFEC"/>
    <g font-size="13">
      <text x="20" y="76" font-weight="700" class="ink3">김민수</text>
      <rect x="20" y="84" width="236" height="32" rx="10" fill="#F2F2F0"/>
      <text x="32" y="105" class="ink">아아 톨 한 잔이요</text>

      <text x="20" y="140" font-weight="700" class="ink3">이지연</text>
      <rect x="20" y="148" width="236" height="32" rx="10" fill="#F2F2F0"/>
      <text x="32" y="169" class="ink">바닐라라떼 벤티, 얼음 적게요</text>

      <text x="20" y="204" font-weight="700" class="ink3">박서연</text>
      <rect x="20" y="212" width="236" height="32" rx="10" fill="#F2F2F0"/>
      <text x="32" y="233" class="ink">저도 아아 톨 하나요</text>
    </g>
  </g>

  <!-- 화살표 -->
  <g transform="translate(800,200)">
    <circle cx="26" cy="0" r="22" fill="#2E7154"/>
    <path d="M16 0 H34 M27 -7 L34 0 L27 7" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 오른쪽: 주문서 -->
  <g transform="translate(866,48)" filter="url(#shadow)">
    <rect width="350" height="304" rx="16" fill="#FFFFFF" stroke="#EAEAE7"/>
  </g>
  <g transform="translate(866,48)">
    <text x="22" y="36" font-size="16" font-weight="800" class="ink">주문서</text>
    <rect x="82" y="20" width="76" height="24" rx="12" fill="#EEF5F1" stroke="#D3E6DA"/>
    <text x="120" y="37" text-anchor="middle" font-size="12" font-weight="700" class="green">스타벅스</text>
    <text x="328" y="36" text-anchor="end" font-size="12" class="muted">공유 = 완료</text>
    <line x1="22" y1="54" x2="328" y2="54" stroke="#EFEFEC"/>

    <text x="22" y="86" font-size="15" font-weight="700" class="ink">아이스 아메리카노 톨</text>
    <text x="328" y="86" text-anchor="end" font-size="15" font-weight="800" class="green">2잔</text>
    <text x="22" y="108" font-size="13" class="muted">김민수 · 박서연</text>
    <line x1="22" y1="124" x2="328" y2="124" stroke="#F3F3F1"/>

    <text x="22" y="154" font-size="15" font-weight="700" class="ink">아이스 바닐라라떼 벤티</text>
    <text x="328" y="154" text-anchor="end" font-size="15" font-weight="800" class="green">1잔</text>
    <text x="22" y="176" font-size="13" class="muted">얼음 적게 · 이지연</text>
    <line x1="22" y1="192" x2="328" y2="192" stroke="#F3F3F1"/>

    <rect x="22" y="204" width="306" height="40" rx="10" fill="#F8F8F7"/>
    <text x="36" y="229" font-size="14" font-weight="700" class="ink3">합계 3명 · 3잔</text>
    <text x="316" y="229" text-anchor="end" font-size="13" class="muted">예상 금액</text>

    <rect x="22" y="258" width="306" height="30" rx="8" fill="#EAF3EE"/>
    <circle cx="40" cy="273" r="5" fill="#2E7154"/>
    <text x="54" y="278" font-size="12" font-weight="600" class="green">자동 복구 정상 · 장애 시험 150회 중 148회 복구</text>
  </g>
</svg>
